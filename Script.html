<script>
(function () {
  'use strict';

  /* ---------- state ---------- */
  var S = {
    data: null,        // apiBootstrap() result
    byNum: {},         // axoNumber -> derived AXO
    queue: 'active',   // see QUEUES
    qa: '',            // team filter
    open: '',          // AXO shown in the detail panel
    composerFor: '',   // AXO the update form was built for
    editId: '',        // update being edited ('' = new)
    dirty: false       // unsaved text in the update form
  };

  var STATUS_VAR = {
    'Not Tested': '--s-new', 'In Progress': '--s-prog', 'Passed - Initial': '--s-pi',
    'Passed - Develop/Deployment': '--s-pd', 'Failed - Initial': '--s-fi', 'Failed - Develop/Deployment': '--s-fd',
    'Needs Monitoring': '--s-mon', 'Urgent/High Prio': '--s-urg', 'Blocked': '--s-blk'
  };
  function sColor(s) { return STATUS_VAR[s] ? 'var(' + STATUS_VAR[s] + ')' : 'var(--line-strong)'; }

  var QUEUES = [
    { key: 'needs', label: 'Needs a QA', color: 'var(--orange)', test: function (a) { return !a.closed && !a.latest; } },
    { key: 'mine', label: 'My AXOs', color: 'var(--brand)', test: function (a) { return !a.closed && a.qas.indexOf(me()) >= 0; } },
    { key: 'due', label: 'Due in 2 days', color: 'var(--warn)', alert: true, test: function (a) { return !a.closed && a.dueIn !== null && a.dueIn <= 2; } },
    { key: 'attention', label: 'Blocked or failing', color: 'var(--bad)', alert: true, test: function (a) { return !a.closed && (a.status === 'Blocked' || a.status === 'Urgent/High Prio' || /^Failed/.test(a.status)); } },
    { key: 'stale', label: 'Going stale', color: 'var(--faint)', test: function (a) { return a.stale; } },
    { key: 'monitor', label: 'Needs monitoring', color: 'var(--s-mon)', test: function (a) { return !a.closed && a.status === 'Needs Monitoring'; } },
    { key: 'active', label: 'All active', color: 'var(--sky)', test: function (a) { return !a.closed; } },
    { key: 'closed', label: 'Closed', color: 'var(--ok)', test: function (a) { return a.closed; } }
  ];
  function queueDef(k) { return QUEUES.filter(function (q) { return q.key === k; })[0] || queueDef('active'); }

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || '')) ? String(u) : ''; }
  function store(key, v) {
    try { if (v === undefined) return localStorage.getItem(key) || ''; localStorage.setItem(key, v); } catch (e) {}
    return '';
  }
  function toast(msg, err) {
    var t = $('toast');
    t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, err ? 6000 : 3000);
  }
  function call(fn) {
    var args = [].slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(e && e.message ? e : new Error(String(e)));
      });
      r[fn].apply(r, args);
    });
  }
  function me() { return store('npdqa.me'); }

  function initials(name) {
    var p = String(name || '?').replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/);
    return ((p[0] || '?').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : (p[0] || '').charAt(1) || '')).toUpperCase();
  }
  function avatar(name, cls) {
    var h = 0; String(name).split('').forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) >>> 0; });
    return '<span class="av ' + (cls || '') + (name === me() ? ' me-av' : '') + '" style="--c:var(--a' + (h % 6 + 1) + ')" title="' + esc(name) + '">' + esc(initials(name)) + '</span>';
  }

  /* Manila time, and the shift that is on now. */
  function manilaNow() {
    var parts = {};
    new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Manila', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' })
      .formatToParts(new Date()).forEach(function (p) { parts[p.type] = p.value; });
    return { date: parts.year + '-' + parts.month + '-' + parts.day, hour: Number(parts.hour) };
  }
  function addDays(iso, n) {
    var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function currentShift() {
    var m = manilaNow();
    if (m.hour >= 5 && m.hour <= 12) return { date: m.date, shift: 'Day' };
    if (m.hour >= 13 && m.hour <= 21) return { date: m.date, shift: 'Mid' };
    return { date: m.hour < 5 ? addDays(m.date, -1) : m.date, shift: 'Night' };
  }
  function prevShift(sd) {
    if (sd.shift === 'Day') return { date: addDays(sd.date, -1), shift: 'Night' };
    return { date: sd.date, shift: sd.shift === 'Mid' ? 'Day' : 'Mid' };
  }
  // Shifts counted from a fixed day, so "how many shifts ago" is a subtraction.
  function shiftIndex(date, shift) { return Math.round(new Date(date + 'T00:00:00Z') / 864e5) * 3 + shiftRank(shift); }
  var STALE_SHIFTS = 2;
  function shiftRank(s) { return s === 'Day' ? 0 : s === 'Mid' ? 1 : s === 'Night' ? 2 : 3; }
  function fmtDay(iso, withYear) {
    if (!/^\d{4}-\d{2}-\d{2}/.test(iso || '')) return iso || '';
    var d = new Date(iso.slice(0, 10) + 'T00:00:00Z');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: withYear ? 'numeric' : undefined, timeZone: 'UTC' });
  }
  function ago(iso) {
    if (!iso) return '';
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 90) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return Math.round(s / 86400) + ' d ago';
  }
  function prioClass(p) {
    // Judge by the first word: the workflow prints e.g. "HIGH (showstopper/blocker/urgent)".
    var s = String(p || '').toLowerCase().replace(/^[^a-z0-9]+/, '');
    if (/^(urgent|critical|blocker|p0)/.test(s)) return 'Urgent';
    if (/^(high|p1)/.test(s)) return 'High';
    if (/^(med|normal|p2)/.test(s)) return 'Medium';
    if (/^(low|p3|p4)/.test(s)) return 'Low';
    return '';
  }
  /* "Nov 14, 2026, 5:23 AM" in Manila time; '' when the value isn't a full timestamp. */
  function fmtStamp(iso) {
    if (!iso || !/T\d{2}:/.test(iso)) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Manila' });
  }
  function stampLine(u) {
    var made = fmtStamp(u.createdAt), edited = fmtStamp(u.updatedAt);
    if (!made) return '';
    var t = 'Logged ' + made;
    if (edited && u.updatedAt.slice(0, 16) !== u.createdAt.slice(0, 16)) t += ' · edited ' + edited;
    return '<time class="ev-time" datetime="' + esc(u.createdAt) + '">' + esc(t) + '</time>';
  }
  // Same rule as closesAxo() in Parser.gs.
  function closesAxo(title, status) {
    if (status === 'Passed - Develop/Deployment') return true;
    return status === 'Passed - Initial' && /\[\s*back[\s-]?end\s*\]/i.test(String(title || ''));
  }
  var SLACK_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h7M12 8.5v7"/></svg>';
  function slackLink(a) {
    var base = S.data.slack && S.data.slack.threadBase, ts = String(a.slackTs || '');
    return base && /^\d+\.\d+$/.test(ts) ? base + ts.replace('.', '') : '';
  }
  function shortPrio(p) { var w = String(p || '').trim().split(/[\s(]/)[0]; return w || String(p || ''); }
  // Sort by status: most in need of attention first, passed last.
  var STATUS_ORDER = ['Urgent/High Prio', 'Blocked', 'Failed - Develop/Deployment', 'Failed - Initial', '', 'Not Tested',
    'In Progress', 'Needs Monitoring', 'Passed - Initial', 'Passed - Develop/Deployment'];
  function statusRank(a) { var i = STATUS_ORDER.indexOf(a.status || ''); return i < 0 ? 5 : i; }
  var PRIO_RANK = { Urgent: 0, High: 1, Medium: 2, Low: 3, '': 4 };

  /* ---------- derive ---------- */
  function derive() {
    var byNum = {};
    S.data.axos.forEach(function (a) { byNum[a.axoNumber] = Object.assign({}, a, { updates: [], qas: [] }); });
    S.data.updates.forEach(function (u) { if (byNum[u.axoNumber]) byNum[u.axoNumber].updates.push(u); });
    var today = manilaNow().date;
    Object.keys(byNum).forEach(function (k) {
      var a = byNum[k];
      a.updates.sort(function (x, y) {
        return (y.shiftDate || '').localeCompare(x.shiftDate || '') || shiftRank(y.shift) - shiftRank(x.shift) ||
          (y.createdAt || '').localeCompare(x.createdAt || '');
      });
      a.latest = a.updates[0] || null;
      a.status = a.latest ? a.latest.status : '';
      var seen = {};
      a.updates.slice().reverse().forEach(function (u) { if (u.qa && !seen[u.qa]) { seen[u.qa] = 1; a.qas.push(u.qa); } });
      a.prio = prioClass(a.priority);
      a.closed = a.state === 'Closed';
      a.dueIn = a.dueDate ? Math.round((new Date(a.dueDate + 'T00:00:00Z') - new Date(today + 'T00:00:00Z')) / 864e5) : null;
      var cs = currentShift();
      a.shiftsSince = a.latest && /^\d{4}-\d{2}-\d{2}$/.test(a.latest.shiftDate || '') ? shiftIndex(cs.date, cs.shift) - shiftIndex(a.latest.shiftDate, a.latest.shift) : null;
      a.stale = !a.closed && a.shiftsSince !== null && a.shiftsSince > STALE_SHIFTS;
      a.lastKey = a.latest ? a.latest.shiftDate + shiftRank(a.latest.shift) + a.latest.createdAt : '';
    });
    S.byNum = byNum;
  }
  function all() { return Object.keys(S.byNum).map(function (k) { return S.byNum[k]; }); }

  /* ---------- header ---------- */
  function renderHeader() {
    var m = me(), cs = m ? myShift() : currentShift();
    var d = new Date(cs.date + 'T00:00:00Z');
    $('shift-line').textContent = cs.shift + ' shift · ' + d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
    var needs = all().filter(queueDef('needs').test).length;
    var lead = m ? 'Hi ' + esc(m.split(/\s|-/)[0]) + ', ' : '';
    $('headline').innerHTML = !m ? 'Pick your name to start logging updates.' :
      needs ? lead + '<em>' + needs + ' AXO' + (needs === 1 ? '' : 's') + '</em> ' + (needs === 1 ? 'needs' : 'need') + ' a QA.' :
      lead + 'every active AXO has a QA on it.';

    var weekAgo = new Date(Date.now() - 7 * 864e5).toISOString();
    var closedWeek = all().filter(function (a) { return a.closed && a.closedAt >= weekAgo; }).length;
    var stats = [
      ['active', all().filter(queueDef('active').test).length, 'active', ''],
      ['needs', needs, 'need a QA', needs ? 'warm' : ''],
      ['due', all().filter(queueDef('due').test).length, 'due in 2 days', ''],
      ['attention', all().filter(queueDef('attention').test).length, 'blocked or failing', ''],
      ['closed', closedWeek, 'closed this week', '']
    ];
    stats[2][3] = stats[2][1] ? 'warm' : ''; stats[3][3] = stats[3][1] ? 'hot' : '';
    $('stats').innerHTML = stats.map(function (s) {
      return '<button class="stat ' + s[3] + '" type="button" data-queue="' + s[0] + '"><b>' + s[1] + '</b><span>' + s[2] + '</span></button>';
    }).join('');

    var sl = S.data.slack, sync = $('sync'), txt, cls = 'sync';
    if (!sl.configured) { txt = 'Slack not connected'; cls += ' err'; sync.title = 'Use Paste AXO to add AXOs'; }
    else if (sl.lastError && sl.lastError.at && (!sl.lastSync.at || sl.lastError.at > sl.lastSync.at)) {
      txt = 'Slack sync failed ' + ago(sl.lastError.at); cls += ' err can'; sync.title = (sl.lastError.error || '') + ' · click to retry';
    } else { txt = sl.lastSync.at ? 'Synced ' + ago(sl.lastSync.at) : 'Waiting for first sync'; cls += ' can'; sync.title = 'Click to sync now'; }
    sync.className = cls; $('sync-text').textContent = txt;

    var names = S.data.qas.slice();
    if (m && names.indexOf(m) < 0) names.push(m);
    $('me-select').innerHTML = '<option value="">Pick your name</option>' + names.map(function (n) {
      return '<option' + (n === m ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');
    $('me-wrap').classList.toggle('missing', !m);
    $('me-av').outerHTML = m ? avatar(m, 'sm').replace('class="av', 'id="me-av" class="av') : '<span class="av sm" id="me-av" aria-hidden="true">?</span>';
  }

  /* ---------- rail ---------- */
  function renderRail() {
    $('queues').innerHTML = QUEUES.map(function (q) {
      var n = all().filter(q.test).length;
      if (q.key === 'mine' && !me()) n = 0;
      return '<button class="queue' + (q.alert && n ? ' alert' : '') + '" type="button" data-queue="' + q.key + '" aria-current="' + (S.queue === q.key) + '" style="--q:' + q.color + '">' +
        '<span class="ic"></span>' + esc(q.label) + '<span class="n">' + n + '</span></button>';
    }).join('');

    var per = {};
    all().forEach(function (a) { a.qas.forEach(function (q) { per[q] = per[q] || { act: 0, tot: 0 }; per[q].tot++; if (!a.closed) per[q].act++; }); });
    S.data.qas.forEach(function (q) { per[q] = per[q] || { act: 0, tot: 0 }; });
    var names = Object.keys(per).sort(function (x, y) { return per[y].act - per[x].act || per[y].tot - per[x].tot || x.localeCompare(y); });
    $('team').innerHTML = names.length ? names.map(function (n) {
      return '<button class="mate" type="button" data-qa="' + esc(n) + '" aria-pressed="' + (S.qa === n) + '">' + avatar(n, 'sm') +
        '<span class="who">' + esc(n) + '</span><span class="cnt">' + per[n].act + ' active</span></button>';
    }).join('') : '<div class="rail-empty">Add QA names in the QAs tab.</div>';
  }

  /* ---------- board ---------- */
  function fillSelect(sel, opts) {
    var v = sel.value || sel.getAttribute('data-want') || '';
    sel.innerHTML = opts.map(function (o) { return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('');
    sel.value = v; if (sel.selectedIndex < 0) sel.selectedIndex = 0;
    sel.removeAttribute('data-want');
  }
  function renderToolbar() {
    fillSelect($('f-prio'), [['', 'Any priority'], ['Urgent', 'Urgent'], ['High', 'High'], ['Medium', 'Medium'], ['Low', 'Low'], ['(none)', 'Not set']]);
    var clients = {}; all().forEach(function (a) { if (a.client) clients[a.client] = 1; });
    fillSelect($('f-client'), [['', 'Any client']].concat(Object.keys(clients).sort().map(function (c) { return [c, c]; })));
  }

  function filtered() {
    var q = $('f-q').value.trim().toLowerCase(), prio = $('f-prio').value, client = $('f-client').value;
    var qd = queueDef(S.queue);
    var list = all().filter(function (a) {
      if (!qd.test(a)) return false;
      if (S.qa && a.qas.indexOf(S.qa) < 0) return false;
      if (prio && (prio === '(none)' ? a.prio !== '' : a.prio !== prio)) return false;
      if (client && a.client !== client) return false;
      if (q) {
        var hay = [a.axoNumber, a.title, a.client, a.ticketNumber, a.raisedBy, a.devAssignees.join(' '), a.qas.join(' ')].join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    var sort = $('f-sort').value;
    list.sort(function (x, y) {
      var r = 0;
      if (sort === 'due') r = (x.dueIn === null ? 1e9 : x.dueIn) - (y.dueIn === null ? 1e9 : y.dueIn) || PRIO_RANK[x.prio] - PRIO_RANK[y.prio];
      else if (sort === 'prio') r = PRIO_RANK[x.prio] - PRIO_RANK[y.prio] || (x.dueIn === null ? 1e9 : x.dueIn) - (y.dueIn === null ? 1e9 : y.dueIn);
      else if (sort === 'updated') r = (y.lastKey || '').localeCompare(x.lastKey || '');
      else if (sort === 'status') r = statusRank(x) - statusRank(y) || (x.dueIn === null ? 1e9 : x.dueIn) - (y.dueIn === null ? 1e9 : y.dueIn);
      return r || Number(y.axoNumber) - Number(x.axoNumber);
    });
    return list;
  }

  function dueHtml(a) {
    if (!a.dueDate) return a.dueDateRaw ? '<span class="due">Due ' + esc(a.dueDateRaw) + '</span>' : '';
    if (a.closed) return '<span class="due">Due ' + esc(fmtDay(a.dueDate)) + '</span>';
    var cls = '', t;
    if (a.dueIn < 0) { cls = 'late'; t = Math.abs(a.dueIn) + 'd overdue'; }
    else if (a.dueIn === 0) { cls = 'soon'; t = 'Due today'; }
    else if (a.dueIn === 1) { cls = 'soon'; t = 'Due tomorrow'; }
    else { cls = a.dueIn <= 2 ? 'soon' : ''; t = 'Due ' + fmtDay(a.dueDate) + ' · ' + a.dueIn + 'd'; }
    return '<span class="due ' + cls + '">' + t + '</span>';
  }
  function statusPill(s) {
    return s ? '<span class="pill" style="--c:' + sColor(s) + '">' + esc(s) + '</span>' : '<span class="pill none">No QA yet</span>';
  }
  function trail(a) {
    var ups = a.updates.slice(0, 8).reverse();
    if (!ups.length) return '';
    return '<span class="trail" aria-label="' + a.updates.length + ' updates">' + (a.updates.length > 8 ? '<span class="more">+' + (a.updates.length - 8) + '</span>' : '') +
      ups.map(function (u) { return '<i style="--c:' + sColor(u.status) + '" title="' + esc(u.status + ' · ' + u.qa + ' · ' + fmtDay(u.shiftDate) + ' ' + u.shift) + '"></i>'; }).join('') + '</span>';
  }

  function isView(q) { return q === 'reports' || q === 'handover'; }
  function renderBoard() {
    var rep = S.queue === 'reports', ho = S.queue === 'handover';
    $('board').hidden = rep || ho; $('reports').hidden = !rep; $('handover').hidden = !ho;
    $('reports-btn').setAttribute('aria-current', String(rep));
    $('handover-btn').setAttribute('aria-current', String(ho));
    if (rep) { renderReports(); return; }
    if (ho) { renderHandover(); return; }
    var qd = queueDef(S.queue), list = filtered();
    $('board-title').innerHTML = esc(qd.label) + (S.qa ? ' <small>worked by ' + esc(S.qa) + ' · <button class="linkish" type="button" id="clear-qa">clear</button></small>' : '');
    if (!list.length) {
      var msg = !all().length
        ? (S.data.slack.configured ? '<b>No AXOs yet</b>They show up here after the next Slack sync.' : '<b>No AXOs yet</b>Use Paste AXO to add one from Slack.')
        : S.queue === 'needs' && !$('f-q').value && !S.qa ? '<b>All caught up</b>Every active AXO has at least one QA update.'
        : '<b>Nothing here</b>No AXOs match this queue and these filters.';
      $('cards').innerHTML = '<div class="empty">' + msg + '</div>';
    } else {
      $('cards').innerHTML = list.map(function (a) {
        var meta = [];
        if (a.client) meta.push('<span class="tag client">' + esc(a.client) + '</span>');
        if (a.ticketNumber) meta.push('<span><span class="k">Ticket</span> ' + esc(a.ticketNumber) + '</span>');
        meta.push('<span><span class="k">Dev</span> ' + (a.devAssignees.length ? esc(a.devAssignees.join(', ')) : 'not assigned') + '</span>');
        var dh = dueHtml(a); if (dh) meta.push(dh);
        if (a.stale) meta.push('<span class="stale" title="Last update ' + esc(fmtDay(a.latest.shiftDate) + ' ' + a.latest.shift) + '">No update in ' + (a.shiftsSince - 1) + ' shifts</span>');
        var sl = slackLink(a);
        var note = a.latest && a.latest.notes ? '<div class="c-note"><b>' + esc(a.latest.qa) + ':</b> ' + esc(a.latest.notes) + '</div>' : '';
        return '<article class="card' + (a.closed ? ' closed' : '') + '" data-open="' + esc(a.axoNumber) + '" aria-current="' + (S.open === a.axoNumber) + '" style="--sc:' + (a.status ? sColor(a.status) : 'var(--orange)') + '" tabindex="0">' +
          '<div class="c-top"><span class="c-num">' + esc(a.axoNumber) + '</span>' + (a.priority ? '<span class="prio ' + a.prio + '" title="' + esc(a.priority) + '">' + esc(shortPrio(a.priority)) + '</span>' : '') +
          statusPill(a.status) + (a.closed ? '<span class="tag closed">Closed</span>' : '') + '</div>' +
          '<div class="c-title">' + esc(a.title || '(no title)') + '</div>' +
          '<div class="c-meta">' + meta.join('') + '</div>' +
          '<div class="c-side">' + (a.qas.length ? '<span class="avs">' + a.qas.slice(0, 5).map(function (q) { return avatar(q); }).join('') + '</span>' : '') +
          trail(a) + '<span class="c-acts">' + (sl ? '<a class="icon-btn" href="' + esc(sl) + '" target="_blank" rel="noopener" title="Open the Slack thread" aria-label="Open the Slack thread for AXO ' + esc(a.axoNumber) + '">' + SLACK_ICON + '</a>' : '') +
          '<button class="upd-btn" type="button" data-update="' + esc(a.axoNumber) + '">Update</button></span></div>' + note + '</article>';
      }).join('');
    }
    var total = all().filter(qd.test).length;
    $('count').textContent = list.length === total ? list.length + ' AXO' + (list.length === 1 ? '' : 's') : list.length + ' of ' + total + ' AXOs';
    $('build').textContent = 'Build ' + S.data.build;
  }

  /* ---------- shift handover ---------- */
  function renderHandover() {
    var cs = currentShift(), prev = prevShift(cs), opts = [], sd = cs;
    for (var i = 0; i < 9; i++) { opts.push(sd); sd = prevShift(sd); }
    var want = S.hoPick || prev.date + '|' + prev.shift;
    $('h-shift').innerHTML = opts.map(function (o, i) {
      var v = o.date + '|' + o.shift;
      return '<option value="' + v + '"' + (v === want ? ' selected' : '') + '>' + (i === 0 ? 'This shift: ' : i === 1 ? 'Last shift: ' : '') + o.shift + ' · ' + esc(fmtDay(o.date)) + '</option>';
    }).join('');
    var pick = want.split('|');
    var rows = [];
    all().forEach(function (a) {
      var ups = a.updates.filter(function (u) { return u.shiftDate === pick[0] && u.shift === pick[1]; });
      if (ups.length) rows.push({ a: a, ups: ups });
    });
    var att = function (s) { return s === 'Blocked' || s === 'Urgent/High Prio' || /^Failed/.test(s) || s === 'Needs Monitoring' || s === 'In Progress' || s === 'Not Tested'; };
    rows.forEach(function (r) { r.last = r.ups[0]; r.rank = statusRank({ status: r.last.status }); });
    rows.sort(function (x, y) { return x.rank - y.rank || Number(y.a.axoNumber) - Number(x.a.axoNumber); });
    var qas = {}; rows.forEach(function (r) { r.ups.forEach(function (u) { qas[u.qa] = 1; }); });
    var open = rows.filter(function (r) { return !r.a.closed && att(r.last.status); });
    var done = rows.filter(function (r) { return !(!r.a.closed && att(r.last.status)); });
    function item(r) {
      var a = r.a, sl = slackLink(a), link = safeUrl(a.link);
      var notes = r.ups.map(function (u) {
        var files = (u.files || []).map(function (f) { var url = safeUrl(f.url); return url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(f.name || 'link') + '</a>' : ''; }).join(' ');
        return '<div class="h-up">' + avatar(u.qa, 'sm') + '<div><b>' + esc(u.qa) + '</b> ' + statusPill(u.status) +
          (u.notes ? '<p>' + esc(u.notes) + '</p>' : '') + (files ? '<div class="links">' + files + '</div>' : '') + '</div></div>';
      }).join('');
      return '<article class="h-item" data-open="' + esc(a.axoNumber) + '" tabindex="0"><div class="h-top"><span class="c-num">' + esc(a.axoNumber) + '</span>' +
        (a.priority ? '<span class="prio ' + a.prio + '">' + esc(shortPrio(a.priority)) + '</span>' : '') + statusPill(a.status) +
        (a.closed ? '<span class="tag closed">Closed</span>' : '') + '<span class="h-links">' +
        (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">Axosoft ↗</a>' : '') + (sl ? '<a href="' + esc(sl) + '" target="_blank" rel="noopener">Slack ↗</a>' : '') + '</span></div>' +
        '<div class="c-title">' + esc(a.title || '(no title)') + '</div>' + dueHtml(a) + notes + '</article>';
    }

        (open.length ? '<h3 class="h-sec">Still open, pick these up · ' + open.length + '</h3><div class="h-list">' + open.map(item).join('') + '</div>' : '') +
        (done.length ? '<h3 class="h-sec">Passed or closed · ' + done.length + '</h3><div class="h-list">' + done.map(item).join('') + '</div>' : '');

  /* ---------- reports ---------- */
  function manilaDay(iso) {
    if (!iso) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
    var d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString('en-CA', { timeZone: 'Asia/Manila' });
  }
  function reportRange() {
    var today = manilaNow().date, v = $('r-range').value, from = today, to = today;
    if (v === 'week') { var wd = new Date(today + 'T00:00:00Z').getUTCDay(); from = addDays(today, -((wd + 6) % 7)); }
    else if (v === '7') from = addDays(today, -6);
    else if (v === '30') from = addDays(today, -29);
    else if (v === 'month') from = today.slice(0, 8) + '01';
    else if (v === 'custom') { from = $('r-from').value || today; to = $('r-to').value || today; if (from > to) { var t = from; from = to; to = t; } }
    return { from: from, to: to };
  }
  function inRange(day, r) { return !!day && day >= r.from && day <= r.to; }

  function reportData() {
    var r = reportRange(), axos = all(), ups = [];
    axos.forEach(function (a) { a.updates.forEach(function (u) { if (inRange(u.shiftDate, r)) ups.push(u); }); });
    var isPass = function (s) { return /^Passed/.test(s); }, isFail = function (s) { return /^Failed/.test(s); };
    var flag = function (s) { return s === 'Blocked' || s === 'Urgent/High Prio'; };

    var per = {};
    function row(n) { return per[n] = per[n] || { name: n, active: 0, axos: {}, updates: 0, Day: 0, Mid: 0, Night: 0, pass: 0, fail: 0, flag: 0, last: '' }; }
    S.data.qas.forEach(row);
    axos.forEach(function (a) { if (!a.closed) a.qas.forEach(function (q) { row(q).active++; }); });
    ups.forEach(function (u) {
      var p = row(u.qa || '(no name)');
      p.updates++; p.axos[u.axoNumber] = 1; if (p[u.shift] != null) p[u.shift]++;
      if (isPass(u.status)) p.pass++; if (isFail(u.status)) p.fail++; if (flag(u.status)) p.flag++;
    });
    axos.forEach(function (a) { a.updates.forEach(function (u) { var p = per[u.qa]; if (p && u.shiftDate > p.last) p.last = u.shiftDate; }); });
    var team = Object.keys(per).map(function (k) { var p = per[k]; p.worked = Object.keys(p.axos).length; return p; })
      .sort(function (x, y) { return y.updates - x.updates || y.active - x.active || x.name.localeCompare(y.name); });

    var status = {};
    axos.forEach(function (a) { if (!a.closed) { var k = a.status || 'No QA yet'; status[k] = (status[k] || 0) + 1; } });

    var clients = {};
    axos.forEach(function (a) {
      if (!inRange(manilaDay(a.postedAt || a.createdAt), r)) return;
      var c = a.client || 'No client'; clients[c] = (clients[c] || 0) + 1;
    });

    return {
      range: r, team: team, status: status, clients: clients,
      tiles: {
        received: axos.filter(function (a) { return inRange(manilaDay(a.postedAt || a.createdAt), r); }).length,
        closed: axos.filter(function (a) { return a.closed && inRange(manilaDay(a.closedAt), r); }).length,
        updates: ups.length,
        worked: Object.keys(ups.reduce(function (m, u) { m[u.axoNumber] = 1; return m; }, {})).length,
        pass: ups.filter(function (u) { return isPass(u.status); }).length,
        fail: ups.filter(function (u) { return isFail(u.status); }).length,
        active: axos.filter(function (a) { return !a.closed; }).length,
        needs: axos.filter(queueDef('needs').test).length
      }
    };
  }

  function renderReports() {
    $('r-custom').hidden = $('r-range').value !== 'custom';
    var d = reportData(), r = d.range, t = d.tiles;
    var label = r.from === r.to ? fmtDay(r.from, true) : fmtDay(r.from, true) + ' to ' + fmtDay(r.to, true);
    var tiles = [[t.received, 'AXOs received'], [t.worked, 'AXOs worked on'], [t.updates, 'QA updates'], [t.pass, 'passed'], [t.fail, 'failed'], [t.closed, 'AXOs closed'], [t.active, 'active now'], [t.needs, 'need a QA now']];
    var maxUp = Math.max.apply(null, d.team.map(function (p) { return p.updates; }).concat(1));
    function num(n, cls) { return '<td class="' + (n ? cls || '' : 'zero') + '">' + n + '</td>'; }
    var rows = d.team.map(function (p) {
      return '<tr data-qa="' + esc(p.name) + '" title="Show ' + esc(p.name) + '\'s active AXOs"><td><span class="who">' + avatar(p.name, 'sm') + esc(p.name) + '</span></td>' +
        num(p.active) + num(p.worked) + '<td class="' + (p.updates ? '' : 'zero') + '">' + p.updates + '<span class="r-load"><i style="width:' + Math.round(100 * p.updates / maxUp) + '%"></i></span></td>' +
        num(p.Day) + num(p.Mid) + num(p.Night) + num(p.pass, 'ok') + num(p.fail, 'bad') + num(p.flag, 'bad') +
        '<td class="' + (p.last ? '' : 'zero') + '">' + (p.last ? esc(fmtDay(p.last)) : 'never') + '</td></tr>';
    }).join('');
    var order = ['No QA yet'].concat(S.data.statuses);
    var sKeys = Object.keys(d.status).sort(function (x, y) { return order.indexOf(x) - order.indexOf(y); });
    var sMax = Math.max.apply(null, sKeys.map(function (k) { return d.status[k]; }).concat(1));

      return '<div class="r-bar"><span>' + esc(k) + '</span><span class="track"><i style="--c:' + (k === 'No QA yet' ? 'var(--orange)' : sColor(k)) + ';width:' + Math.round(100 * d.status[k] / sMax) + '%"></i></span><b>' + d.status[k] + '</b></div>';

    var cbars = cKeys.map(function (k) {

      '<section class="r-card"><h3>QA workload</h3><p class="r-sub">Click a name to see that QA\'s active AXOs.</p><div class="r-scroll"><table class="r-table"><thead><tr>' +
      '<th>QA</th><th>Active AXOs</th><th>AXOs worked</th><th>Updates</th><th>Day</th><th>Mid</th><th>Night</th><th>Passed</th><th>Failed</th><th>Blocked or urgent</th><th>Last update</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div></section>' +
      '<div class="r-two"><section class="r-card"><h3>Active AXOs by status</h3><p class="r-sub">Latest QA status of every open AXO.</p><div class="r-bars">' + bars + '</div></section>' +
      '<section class="r-card"><h3>AXOs received by client</h3><p class="r-sub">' + esc(label) + '</p><div class="r-bars">' + cbars + '</div></section></div>';
    $('count').textContent = '';
    S.lastReport = d;
  }

  function reportCsv(d) {
    function q(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var t = d.tiles, lines = [];
    lines.push(['NPD QA AXO Tracker report', d.range.from + ' to ' + d.range.to].map(q).join(','));
    lines.push('');
    lines.push('Metric,Count');
    [['AXOs received', t.received], ['AXOs worked on', t.worked], ['QA updates', t.updates], ['Passed', t.pass], ['Failed', t.fail],
      ['AXOs closed', t.closed], ['Active now', t.active], ['Need a QA now', t.needs]].forEach(function (x) { lines.push(x.map(q).join(',')); });
    lines.push('');
    lines.push('QA,Active AXOs,AXOs worked,Updates,Day,Mid,Night,Passed,Failed,Blocked or urgent,Last update');
    d.team.forEach(function (p) { lines.push([p.name, p.active, p.worked, p.updates, p.Day, p.Mid, p.Night, p.pass, p.fail, p.flag, p.last].map(q).join(',')); });
    lines.push('');

  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove(); return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  function saveUpdate(ev) {

    var st = document.querySelector('input[name="c-status"]:checked'), sh = document.querySelector('input[name="c-shift"]:checked');
    var payload = {
      axoNumber: S.open, qa: me(), shiftDate: $('c-date').value, shift: sh ? sh.value : '', status: st ? st.value : '',
      notes: $('c-notes').value,
      files: [].map.call($('c-links').children, function (row) {
        return { name: row.querySelector('.lk-name').value.trim(), url: row.querySelector('.lk-url').value.trim() };
      }).filter(function (x) { return x.url; })
    };
    if (payload.files.some(function (x) { return !safeUrl(x.url); })) { err.textContent = 'Links must start with https://'; err.hidden = false; return; }
    btn.disabled = true; err.hidden = true;
    var editing = S.editId;
    (editing ? call('apiEditUpdate', editing, payload) : call('apiAddUpdate', payload)).then(function (d) {
      S.data = d; S.editId = ''; S.composerFor = ''; S.dirty = false;
      render();
      toast(editing ? 'Update saved.' : 'Update added to AXO ' + payload.axoNumber + '.');
    }, function (e) { err.textContent = e.message; err.hidden = false; btn.disabled = false; });
  }

  function requireMe() {
    if (me()) return true;
    var w = $('me-wrap'); w.classList.remove('nudge'); void w.offsetWidth; w.classList.add('nudge');
    $('me-select').focus();
    toast('Pick your name at the top right first.', true);
    return false;
  }

  /* ---------- pick + paste dialogs ---------- */
  function openPick() {
    $('axo-options').innerHTML = all().filter(function (a) { return !a.closed; })
      .sort(function (x, y) { return Number(y.axoNumber) - Number(x.axoNumber); })
      .map(function (a) { return '<option value="' + esc(a.axoNumber + ' - ' + (a.title || '')) + '"></option>'; }).join('');
    $('pick-axo').value = ''; $('pick-err').hidden = true;
    $('pick-dlg').showModal(); $('pick-axo').focus();
  }
  function openPaste() {
    $('paste-text').value = ''; $('paste-preview').hidden = true; $('paste-err').hidden = true; $('paste-save').disabled = true;
    $('paste-dlg').showModal(); $('paste-text').focus();
  }
  function checkPaste() {
    var text = $('paste-text').value;
    $('paste-err').hidden = true;
    if (!text.trim()) return;
    call('apiParseAxo', text).then(function (a) {
      if (!a) {
        $('paste-err').textContent = 'No AXO number found. Paste the whole Slack post, starting from "Axo Number".';
        $('paste-err').hidden = false; $('paste-preview').hidden = true; $('paste-save').disabled = true; return;
      }
      var exists = S.byNum[a.axoNumber];
      var rows = [['AXO', a.axoNumber], ['Title', a.title], ['Priority', a.priority], ['Link', a.link],
        ['Due date', a.dueDate ? fmtDay(a.dueDate, true) : a.dueDateRaw], ['Client', a.client], ['Ticket', a.ticketNumber],
        ['Raised by', a.raisedBy], ['Dev', a.devAssignees.join(', ')]];
      $('paste-preview').innerHTML = (exists ? '<div class="tip" style="margin:0 0 10px"><b>Already in the tracker.</b> Saving fills in any blanks and won\'t create a duplicate.</div>' : '') +
        '<dl class="facts">' + rows.map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + esc(r[1] || '—') + '</dd>'; }).join('') + '</dl>';
      $('paste-preview').hidden = false;
      $('paste-save').disabled = false;
      $('paste-save').textContent = exists ? 'Update AXO' : 'Add AXO';
    }, function (e) { $('paste-err').textContent = e.message; $('paste-err').hidden = false; });
  }
  function savePaste(ev) {
    ev.preventDefault();
    $('paste-save').disabled = true;
    call('apiPasteAxo', $('paste-text').value).then(function (r) {
      $('paste-dlg').close();
      toast(r.added ? 'AXO ' + r.axo.axoNumber + ' added.' : r.updated ? 'AXO ' + r.axo.axoNumber + ' updated.' : 'AXO ' + r.axo.axoNumber + ' was already up to date.');
      return refresh().then(function () { openDetail(r.axo.axoNumber); });
    }, function (e) { $('paste-err').textContent = e.message; $('paste-err').hidden = false; $('paste-save').disabled = false; });
  }

  /* ---------- render + data ---------- */
  function render() {
    derive();
    renderHeader();
    renderRail();
    renderToolbar();
    renderBoard();
    renderDetail();
  }
  function refresh() {
    return call('apiBootstrap').then(function (d) { S.data = d; render(); }, function (e) { toast(e.message, true); });
  }
  function savePrefs() {
    store('npdqa.view', JSON.stringify({ queue: S.queue, qa: S.qa, prio: $('f-prio').value, client: $('f-client').value, sort: $('f-sort').value, range: $('r-range').value, from: $('r-from').value, to: $('r-to').value }));
  }
  function loadPrefs() {
    var p = null;
    try { p = JSON.parse(store('npdqa.view') || 'null'); } catch (e) {}
    if (!p) { S.queue = me() ? 'needs' : 'active'; return; }
    S.queue = p.queue || 'active'; S.qa = p.qa || '';
    if (p.prio) $('f-prio').setAttribute('data-want', p.prio);
    if (p.client) $('f-client').setAttribute('data-want', p.client);
    if (p.sort) $('f-sort').value = p.sort;
    if (p.range) $('r-range').value = p.range;
    if (p.from) $('r-from').value = p.from;
    if (p.to) $('r-to').value = p.to;
  }

  /* ---------- events ---------- */
  function wire() {
    $('me-select').onchange = function () { store('npdqa.me', this.value); S.composerFor = ''; render(); };
    $('help-btn').onclick = function () { $('help-dlg').showModal(); };
    $('help-close').onclick = function () { $('help-dlg').close(); };
    $('paste-btn').onclick = openPaste;
    $('add-btn').onclick = function () { if (requireMe()) openPick(); };
    $('sync').onclick = function () {
      if (!S.data || !S.data.slack.configured) { toast('Slack sync is not set up. Use Paste AXO to add AXOs.'); return; }
      $('sync').className = 'sync busy'; $('sync-text').textContent = 'Syncing…';
      call('apiSyncNow').then(function (d) { S.data = d; render(); toast('Slack sync done.'); }, function (e) { toast(e.message, true); render(); });
    };

    function pickQueue(e) {
      var b = e.target.closest('[data-queue]'); if (!b) return;
      var was = S.queue; S.queue = b.getAttribute('data-queue'); savePrefs(); renderRail(); renderBoard();
      if (isView(was) || isView(S.queue)) renderDetail();
    }
    $('queues').onclick = pickQueue; $('stats').onclick = pickQueue;
    function openView(v) {
      if (S.dirty && !confirmDiscard()) return;
      S.queue = v; S.open = ''; S.composerFor = ''; S.dirty = false; savePrefs(); renderRail(); renderBoard(); renderDetail();
      window.scrollTo(0, 0);
    }
    $('reports-btn').onclick = function () { openView('reports'); };
    $('handover-btn').onclick = function () { S.hoPick = ''; openView('handover'); };
    $('h-shift').addEventListener('change', function () { S.hoPick = $('h-shift').value; renderHandover(); });
    $('h-body').onclick = function (e) {
      var c = e.target.closest('[data-open]'); if (!c || e.target.closest('a')) return;
      var a = S.byNum[c.getAttribute('data-open')]; if (!a) return;
      S.queue = a.closed ? 'closed' : 'active'; S.qa = ''; savePrefs(); renderRail(); openDetail(a.axoNumber); window.scrollTo(0, 0);
    };
    ['r-range', 'r-from', 'r-to'].forEach(function (id) { $(id).addEventListener('change', function () { savePrefs(); renderReports(); }); });
    $('r-copy').onclick = function () {
      if (!S.lastReport) return;
      copyText(reportCsv(S.lastReport)).then(function (ok) { toast(ok ? 'Report copied. Paste it into a sheet or email.' : 'Copy was blocked by the browser.', !ok); });
    };
    $('r-body').onclick = function (e) {
      var tr = e.target.closest('tr[data-qa]'); if (!tr) return;
      S.qa = tr.getAttribute('data-qa'); S.queue = 'active'; savePrefs(); renderRail(); renderBoard(); renderDetail(); window.scrollTo(0, 0);
    };
    $('team').onclick = function (e) {
      var b = e.target.closest('[data-qa]'); if (!b) return;
      var q = b.getAttribute('data-qa'); S.qa = S.qa === q ? '' : q; savePrefs(); renderRail(); renderBoard();
    };
    $('board-title').onclick = function (e) { if (e.target.id === 'clear-qa') { S.qa = ''; savePrefs(); renderRail(); renderBoard(); } };
    $('f-q').addEventListener('input', renderBoard);
    ['f-prio', 'f-client', 'f-sort'].forEach(function (id) { $(id).addEventListener('change', function () { savePrefs(); renderBoard(); }); });

    $('cards').onclick = function (e) {
      if (e.target.closest('a')) return;
      var u = e.target.closest('[data-update]'); if (u) { openDetail(u.getAttribute('data-update'), true); return; }
      var c = e.target.closest('[data-open]'); if (c) openDetail(c.getAttribute('data-open'));
    };
    $('cards').onkeydown = function (e) {
      if (e.key !== 'Enter' || e.target.tagName === 'BUTTON') return;
      var c = e.target.closest('[data-open]'); if (c) openDetail(c.getAttribute('data-open'));
    };

    $('detail').onclick = function (e) {
      var a = S.byNum[S.open]; if (!a) return;
      if (e.target.closest('#d-close')) { closeDetail(); return; }
      if (e.target.closest('#d-toggle')) {
        if (!requireMe()) return;
        var b = e.target.closest('#d-toggle'); b.disabled = true;
        call('apiSetAxoState', a.axoNumber, a.closed ? 'Active' : 'Closed').then(function (d) {
          S.data = d; render(); toast('AXO ' + a.axoNumber + (a.closed ? ' reopened.' : ' closed.'));
        }, function (er) { toast(er.message, true); b.disabled = false; });
        return;
      }
      var ed = e.target.closest('[data-edit]');
      if (ed) { S.editId = ed.getAttribute('data-edit'); S.composerFor = ''; renderDetail(); $('c-notes').focus(); return; }
      var del = e.target.closest('[data-del]');
      if (del) {
        if (del.getAttribute('data-armed') !== '1') { del.setAttribute('data-armed', '1'); del.textContent = 'Click again to delete'; return; }
        call('apiDeleteUpdate', del.getAttribute('data-del')).then(function (d) { S.data = d; render(); toast('Update deleted.'); }, function (er) { toast(er.message, true); });
      }
    };
    $('scrim').onclick = closeDetail;
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && S.open && !document.querySelector('dialog[open]')) closeDetail();
    });
    window.matchMedia('(max-width:1240px)').addEventListener('change', function () { if (S.data) renderDetail(); });

    $('pick-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var m = $('pick-axo').value.match(/\d{3,}/);
      if (!m || !S.byNum[m[0]]) { $('pick-err').textContent = 'Pick an AXO from the list.'; $('pick-err').hidden = false; return; }
      $('pick-dlg').close(); openDetail(m[0], true);
    });
    $('pick-cancel').onclick = function () { $('pick-dlg').close(); };
    $('paste-form').addEventListener('submit', savePaste);
    $('paste-cancel').onclick = function () { $('paste-dlg').close(); };
    $('paste-check').onclick = checkPaste;
    $('paste-text').addEventListener('paste', function () { setTimeout(checkPaste, 0); });

    // New AXOs arrive from Slack: refresh every 2 minutes while the tab is visible.
    setInterval(function () {
      if (document.visibilityState === 'visible' && !document.querySelector('dialog[open]')) refresh();
    }, 120000);
  }

  /* Frozen header: publish the top bar's height so the filter row, rail and
     detail panel pin just under it, and add shadows once the page scrolls. */
  function pinHeader() {
    var bar = $('topbar'), head = document.querySelector('.board-head');
    function pinned() { return getComputedStyle(bar).position === 'sticky'; }
    function measure() { document.documentElement.style.setProperty('--top-h', (pinned() ? bar.offsetHeight : 0) + 'px'); }
    function onScroll() {
      var y = window.scrollY > 4;
      bar.classList.toggle('scrolled', y);
      if (head) head.classList.toggle('stuck', head.getBoundingClientRect().top <= (pinned() ? bar.offsetHeight : 0) + 1 && y);
    }
    measure(); onScroll();
    if (window.ResizeObserver) new ResizeObserver(measure).observe(bar);
    window.addEventListener('resize', measure);
    window.addEventListener('scroll', onScroll, { passive: true });
  }

  wire();
  pinHeader();
  loadPrefs();
  refresh();
})();
</script>
