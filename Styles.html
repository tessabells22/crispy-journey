<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* NPD QA AXO Tracker. ShipERP colours (blue, sky, orange) in a workbench layout:
   shift header, queue rail, AXO cards, detail panel with an inline update form. */
:root{
 --bg:#f3f6fa; --surface:#ffffff; --surface-2:#edf2f7; --fg:#132030; --muted:#566578; --faint:#8794a4;
 --line:#dfe6ee; --line-strong:#c6d2de;
 --brand:#0F6EC8; --brand-ink:#ffffff; --brand-soft:#e7f0fa; --sky:#059BD7; --orange:#F19305;
 --hero:#0b2a4a; --hero-2:#0f3a66; --hero-fg:#eaf2fb; --hero-muted:#a9bfd6;
 --ok:#16834a; --warn:#b06a00; --bad:#c2372f; --bad-soft:#fbeceb;
 --s-new:#64748B; --s-prog:#2563EB; --s-pi:#0F766E; --s-pd:#15803D; --s-fi:#C2410C; --s-fd:#B91C1C;
 --s-mon:#7C3AED; --s-urg:#BE185D; --s-blk:#A16207;
 --a1:#0F6EC8; --a2:#0F766E; --a3:#B4510A; --a4:#7C3AED; --a5:#BE185D; --a6:#475569;
 --shadow:0 1px 2px rgba(19,32,48,.05),0 8px 24px rgba(19,32,48,.07);
 --radius:12px;
 --font:"Geist",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
 color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0c141d; --surface:#131e2a; --surface-2:#1a2735; --fg:#e3eaf2; --muted:#98a6b6; --faint:#6e7d8e;
 --line:#243446; --line-strong:#33475c;
 --brand:#4a9be6; --brand-ink:#08131f; --brand-soft:#15304b; --sky:#3bb6ea; --orange:#f5a733;
 --hero:#0a1f36; --hero-2:#0e2c4d; --hero-fg:#e6eef7; --hero-muted:#93a9c1;
 --ok:#4cc27e; --warn:#f0a83a; --bad:#ef6a62; --bad-soft:#3a1d1c;
 --s-new:#94A3B8; --s-prog:#60A5FA; --s-pi:#2DD4BF; --s-pd:#4ADE80; --s-fi:#FB923C; --s-fd:#F87171;
 --s-mon:#A78BFA; --s-urg:#F472B6; --s-blk:#FACC15;
 --a1:#4a9be6; --a2:#2DD4BF; --a3:#f5a733; --a4:#A78BFA; --a5:#F472B6; --a6:#94A3B8;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0c141d; --surface:#131e2a; --surface-2:#1a2735; --fg:#e3eaf2; --muted:#98a6b6; --faint:#6e7d8e;
 --line:#243446; --line-strong:#33475c;
 --brand:#4a9be6; --brand-ink:#08131f; --brand-soft:#15304b; --sky:#3bb6ea; --orange:#f5a733;
 --hero:#0a1f36; --hero-2:#0e2c4d; --hero-fg:#e6eef7; --hero-muted:#93a9c1;
 --ok:#4cc27e; --warn:#f0a83a; --bad:#ef6a62; --bad-soft:#3a1d1c;
 --s-new:#94A3B8; --s-prog:#60A5FA; --s-pi:#2DD4BF; --s-pd:#4ADE80; --s-fi:#FB923C; --s-fd:#F87171;
 --s-mon:#A78BFA; --s-urg:#F472B6; --s-blk:#FACC15;
 --a1:#4a9be6; --a2:#2DD4BF; --a3:#f5a733; --a4:#A78BFA; --a5:#F472B6; --a6:#94A3B8;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand);filter:brightness(1.08)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn-quiet:hover{color:var(--fg);background:var(--surface-2)}
.btn-sm{padding:4px 10px;font-size:12.5px}
.linkish{background:none;border:0;padding:2px 0;color:var(--brand);font:500 12.5px/1.2 var(--font);cursor:pointer}
.linkish:hover{text-decoration:underline}
.linkish.danger{color:var(--bad)}

/* ---------- shift header ---------- */
.hero,.topbar{background:linear-gradient(135deg,var(--hero) 0%,var(--hero-2) 100%);color:var(--hero-fg)}
/* Frozen header: the top bar stays pinned, and the board's search/filter row pins under it. */
:root{--top-h:58px}
.topbar{position:sticky;top:0;z-index:50;background-attachment:fixed;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.topbar.scrolled{box-shadow:0 6px 18px rgba(6,14,24,.28)}
.hero-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 24px;max-width:1680px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg .box{stroke:#fff} .brand svg .speed{stroke:var(--orange)}
.wordmark{font:800 19px/1 var(--font);letter-spacing:-.01em;color:#fff}
.wordmark span{color:var(--orange)}
.brand .app{font:600 14px/1 var(--font);color:var(--hero-muted);padding-left:10px;border-left:1px solid rgba(255,255,255,.18);white-space:nowrap}
.topbar .btn,.hero .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:var(--hero-fg)}
.topbar .btn:hover,.hero .btn:hover{background:rgba(255,255,255,.16)}
.topbar .btn-primary,.hero .btn-primary{background:var(--orange);border-color:var(--orange);color:#1b1205;font-weight:600}
.topbar .btn-primary:hover,.hero .btn-primary:hover{background:var(--orange);filter:brightness(1.06)}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--hero-muted);white-space:nowrap;background:none;border:0;padding:6px 4px;cursor:default}
.sync i{width:8px;height:8px;border-radius:50%;background:#4cc27e;box-shadow:0 0 0 3px rgba(76,194,126,.2)}
.sync.busy i{background:var(--sky);box-shadow:0 0 0 3px rgba(59,182,234,.25)}
.sync.err i{background:#ef6a62;box-shadow:0 0 0 3px rgba(239,106,98,.25)}
.sync.can{cursor:pointer} .sync.can:hover{color:#fff}
.me{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px 4px 3px 3px}
.me select{background:transparent;border:0;color:var(--hero-fg);font-weight:600;font-size:13px;padding:4px 4px;max-width:150px;cursor:pointer}
.me select option{color:#132030}
.me.missing{border-color:var(--orange);box-shadow:0 0 0 3px rgba(241,147,5,.25)}
.me.missing select{color:var(--orange)}
.me.nudge{animation:nudge .6s ease-in-out 2}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

.hero-main{max-width:1680px;margin:0 auto;padding:14px 24px 22px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px}
.shift-line{font:600 11.5px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--sky);display:flex;align-items:center;gap:8px}
.shift-line .dot{width:6px;height:6px;border-radius:50%;background:var(--orange)}
.hero h1{font:700 clamp(22px,3vw,30px)/1.2 var(--font);letter-spacing:-.02em;margin-top:8px;color:#fff}
.hero h1 em{font-style:normal;color:var(--orange)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 14px;min-width:96px;text-align:left;color:var(--hero-fg);cursor:pointer}
.stat:hover{background:rgba(255,255,255,.13)}
.stat b{display:block;font:700 22px/1.1 var(--font);font-variant-numeric:tabular-nums;color:#fff}
.stat span{font-size:11.5px;color:var(--hero-muted);white-space:nowrap}
.stat.hot b{color:#ffb4ae}
.stat.warm b{color:#ffcf85}

/* ---------- three-pane shell ---------- */
.shell{max-width:1680px;margin:0 auto;padding:18px 24px 40px;display:grid;grid-template-columns:232px minmax(0,1fr) minmax(380px,460px);gap:18px;align-items:start}
.shell.no-detail{grid-template-columns:232px minmax(0,1fr)}

/* queue rail */
.rail{position:sticky;top:calc(var(--top-h) + 14px);display:flex;flex-direction:column;gap:18px}
.rail h2{font:600 11px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 8px 10px}
.queues{display:flex;flex-direction:column;gap:2px}
.queue{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;color:var(--muted);font-weight:500;font-size:13.5px}
.queue:hover{background:var(--surface);color:var(--fg)}
.queue .ic{width:8px;height:8px;border-radius:3px;background:var(--q,var(--faint));flex:none}
.queue .n{margin-left:auto;font:600 12px/1 var(--mono);color:var(--faint);background:var(--surface-2);border-radius:999px;padding:4px 8px;font-variant-numeric:tabular-nums}
.queue[aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.queue[aria-current="true"] .n{background:var(--brand);color:var(--brand-ink)}
.queue.alert .n{background:var(--bad-soft);color:var(--bad)}
.team{display:flex;flex-direction:column;gap:2px}
.mate{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:8px;padding:6px 10px;text-align:left;cursor:pointer;font-size:13px;color:var(--fg)}
.mate:hover{background:var(--surface)}
.mate[aria-pressed="true"]{background:var(--brand-soft)}
.mate .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mate .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rail-empty{font-size:12.5px;color:var(--faint);padding:2px 10px}

/* avatars */
.av{--c:var(--a6);width:26px;height:26px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;
 font:700 10.5px/1 var(--font);letter-spacing:.02em;color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1.5px solid var(--surface)}
.av.sm{width:22px;height:22px;font-size:9.5px}
.av.me-av{box-shadow:0 0 0 2px var(--brand)}
.avs{display:flex}
.avs .av+.av{margin-left:-6px}

/* list toolbar */
.board{display:flex;flex-direction:column;gap:12px;min-width:0}
.board-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;position:sticky;top:var(--top-h);z-index:20;background:var(--bg);margin:-18px -6px 0;padding:18px 6px 10px}
.board-head.stuck{box-shadow:0 8px 12px -10px rgba(6,14,24,.35)}
.board-head h2{font:700 18px/1.2 var(--font);letter-spacing:-.01em;flex-basis:100%}
.board-head h2 small{font:500 13px/1 var(--font);color:var(--muted);margin-left:8px}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px 9px 34px;font-size:13.5px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);stroke:var(--faint)}
.tb-sel{background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;font-size:13px;max-width:170px}

/* AXO cards */
.cards{display:flex;flex-direction:column;gap:10px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 14px 18px;cursor:pointer;
 display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;transition:border-color .12s,box-shadow .12s}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--sc,var(--line-strong))}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card[aria-current="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),var(--shadow)}
.card.closed{opacity:.78}
.c-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0}
.c-num{font:600 13px/1 var(--mono);color:var(--brand)}
.c-title{grid-column:1;font:600 15px/1.35 var(--font);letter-spacing:-.005em}
.c-meta{grid-column:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.c-meta .k{color:var(--faint)}
.c-note{grid-column:1/-1;font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.c-note b{color:var(--fg);font-weight:600}
.c-side{grid-column:2;grid-row:1 / span 3;display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
.trail{display:flex;gap:3px;align-items:center}
.trail i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.trail .more{font-size:11px;color:var(--faint);margin-right:2px}
.upd-btn{border:1px solid var(--brand);background:var(--surface);color:var(--brand);border-radius:8px;padding:5px 12px;font:600 12.5px/1.3 var(--font);cursor:pointer;white-space:nowrap}
.upd-btn:hover{background:var(--brand);color:var(--brand-ink)}

/* pills */
.pill{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1.2;color:var(--c);
 background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:999px;padding:3px 10px 3px 8px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.pill.none{--c:var(--faint);font-weight:500}
.tag{display:inline-block;font-size:11.5px;font-weight:500;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:2px 8px;white-space:nowrap}
.tag.client{color:var(--brand);background:var(--brand-soft)}
.tag.closed{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.prio{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 7px;white-space:nowrap;color:var(--muted);background:var(--surface-2)}
.prio.Urgent{color:#fff;background:var(--bad)}
.prio.High{color:var(--bad);background:var(--bad-soft)}
.prio.Medium{color:var(--warn);background:color-mix(in srgb,var(--orange) 15%,transparent)}
.prio.Low{color:var(--sky);background:color-mix(in srgb,var(--sky) 13%,transparent)}
.due{font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.due.soon{color:var(--warn);font-weight:600}
.due.late{color:var(--bad);font-weight:700}

.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.foot{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);padding:4px 2px}

/* detail panel */
.detail{position:sticky;top:calc(var(--top-h) + 14px);max-height:calc(100vh - var(--top-h) - 28px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.d-head{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;position:sticky;top:0;background:var(--surface);z-index:2}
.d-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.d-top .c-num{font-size:14px}
.d-top .acts{margin-left:auto;display:flex;gap:4px}
.d-head h2{font:700 18px/1.3 var(--font);letter-spacing:-.01em}
.d-people{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.d-people b{color:var(--fg);font-weight:500}
.d-body{padding:16px 18px 22px;display:flex;flex-direction:column;gap:22px}
.d-body h3{font:600 11px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}

/* inline update form */
.composer{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.composer.editing{border-color:var(--orange);box-shadow:0 0 0 2px color-mix(in srgb,var(--orange) 25%,transparent)}
.composer .lbl{font:600 10.5px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:500;color:var(--fg)}
.chips span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.chips input:checked + span{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);font-weight:600}
.chips input:focus-visible + span{outline:2px solid var(--sky);outline-offset:2px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg input:checked + span{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(19,32,48,.15)}
.seg input:focus-visible + span{outline:2px solid var(--sky)}
.fld{display:flex;flex-direction:column;gap:5px}
.fld input,.fld textarea,.fld select,.link-row input{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;font-size:13.5px;width:100%;min-width:0}
.fld textarea{min-height:84px;resize:vertical;line-height:1.45}
.link-rows{display:flex;flex-direction:column;gap:6px}
.link-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) auto;gap:6px}
.c-foot{display:flex;align-items:center;gap:8px}
.c-foot .who{font-size:12.5px;color:var(--muted);margin-right:auto;display:flex;align-items:center;gap:6px}
.err{padding:8px 10px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:13px}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;padding:0 0 16px 36px}
.ev:last-child{padding-bottom:0}
.ev .av{position:absolute;left:0;top:0}
.ev-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--muted)}
.ev-meta b{color:var(--fg);font-weight:600;font-size:13px}
.ev-meta .acts{margin-left:auto;display:flex;gap:10px}
.ev p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.ev .links{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:12.5px}
.ev .links a{color:var(--brand);word-break:break-all}
.tl-empty{font-size:13px;color:var(--muted)}
.ev-time{display:block;font-size:11.5px;color:var(--faint);margin-top:3px;font-variant-numeric:tabular-nums}

.facts{display:grid;grid-template-columns:110px minmax(0,1fr);gap:7px 12px;font-size:13.5px;margin:0}
.facts dt{color:var(--faint);font-size:12.5px}
.facts dd{margin:0;min-width:0;word-break:break-word}
.info-box{white-space:pre-wrap;word-break:break-word;font-size:13.5px;background:var(--bg);border-radius:8px;padding:10px 12px}
.d-empty{padding:56px 24px;text-align:center;color:var(--muted)}
.d-empty svg{stroke:var(--line-strong);margin-bottom:10px}
.d-empty b{display:block;color:var(--fg);margin-bottom:4px}

/* dialogs */
dialog{border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(620px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(6,14,24,.55)}
